<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>GymForge — AI-Powered Gym Guide</title>
  <meta name="description" content="Transform your body with personalized AI-powered workout plans, daily tracking, and Indian diet recommendations with complete nutritional breakdown." />
  <meta name="author" content="GymForge" />
  <meta name="theme-color" content="#0a0a0f" />

  <!-- ── PWA Manifest ── -->
  <link rel="manifest" href="/manifest.json" />

  <!-- ── iOS PWA Support ── -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GymForge" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- iOS Splash Screens (prevents white flash on launch) -->
  <!-- iPhone 14 Pro Max (430×932) -->
  <link rel="apple-touch-startup-image"
    media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)"
    href="/icons/icon-512.png" />
  <!-- iPhone 14 / 13 / 12 (390×844) -->
  <link rel="apple-touch-startup-image"
    media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
    href="/icons/icon-512.png" />
  <!-- iPhone SE 3rd gen (375×667) -->
  <link rel="apple-touch-startup-image"
    media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)"
    href="/icons/icon-512.png" />

  <!-- ── Android / Chrome ── -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />

  <!-- ── Open Graph ── -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="GymForge — AI-Powered Gym Guide" />
  <meta property="og:description" content="Transform your body with personalized workout plans, tracking, and Indian diet plans with full nutrition data." />
  <meta property="og:image" content="/icons/icon-512.png" />

  <!-- ── Twitter ── -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="GymForge — AI-Powered Gym Guide" />
  <meta name="twitter:description" content="Transform your body with personalized workout plans, tracking, and Indian diet plans with full nutrition data." />

  <!-- ── Favicon ── -->
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />

  <!-- ── Preconnect to Google Fonts ── -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
</head>
<body>
  <canvas id="three-canvas" class="three-canvas"></canvas>
  <div id="app"></div>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.warn('SW registration failed:', err));
      });
    }
  </script>

  <!-- iOS Install Prompt Banner -->
  <script>
    // Show install hint on iOS Safari
    (function() {
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      const isStandalone = window.navigator.standalone === true;
      const dismissed = sessionStorage.getItem('gymforge-install-dismissed');

      if (isIOS && !isStandalone && !dismissed) {
        setTimeout(() => {
          const banner = document.createElement('div');
          banner.id = 'ios-install-banner';
          banner.style.cssText = `
            position:fixed;bottom:0;left:0;right:0;z-index:9999;
            background:rgba(18,18,26,0.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
            border-top:1px solid rgba(255,255,255,0.06);
            padding:16px 20px;padding-bottom:calc(16px + env(safe-area-inset-bottom));
            display:flex;align-items:center;gap:14px;
            animation:slideUp 0.4s cubic-bezier(0.16,1,0.3,1) both;
          `;
          banner.innerHTML = `
            <img src="/apple-touch-icon.png" alt="GymForge" style="width:48px;height:48px;border-radius:12px;flex-shrink:0;" />
            <div style="flex:1;min-width:0;">
              <div style="font-weight:700;font-size:15px;color:#F5F5F5;margin-bottom:2px;">Install GymForge</div>
              <div style="font-size:12px;color:#9CA3AF;line-height:1.4;">Tap <strong style="color:#F5F5F5;">Share</strong> ↗ then <strong style="color:#F5F5F5;">Add to Home Screen</strong></div>
            </div>
            <button onclick="this.parentElement.remove();sessionStorage.setItem('gymforge-install-dismissed','1')"
              style="background:none;border:none;color:#9CA3AF;font-size:22px;cursor:pointer;padding:4px 8px;flex-shrink:0;">✕</button>
          `;
          document.body.appendChild(banner);
        }, 3000);
      }
    })();
  </script>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
